<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(-45deg, #eff6ff, #dbeafe, #bfdbfe);
            background-size: 400% 400%;
            animation: g 15s ease infinite;
            font-family: sans-serif;
        }
        @keyframes g { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}}
        
        .box {
            background: white; padding: 2rem; border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 300px;
        }
        input {
            width: 100%; padding: 10px; margin: 10px 0;
            border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 10px; background: #3b82f6; color: white;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #2563eb; }
        .err { color: red; font-size: 0.9rem; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:#333;">Login</h2>
        {% if error %} <span class="err">{{ error }}</span> {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
